name: Prepare night imagery for content redesign
on:
  push:
    paths: [".github/workflows/prepare-night-assets.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch generated photo
        run: |
          mkdir -p /tmp/night-assets
          curl --fail --location --retry 2 --max-time 90 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:97726676-7925-4057-82f0-c34700e8f377' -o /tmp/night-assets/source.png
          python3 -m pip install 'Pillow==11.3.0'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('/tmp/night-assets')
          image = Image.open(p/'source.png')
          assert image.format == 'PNG' and image.width >= 1200
          image.save(p/'hero-night.webp', format='WEBP', quality=84, method=6)
          (p/'cat-window.webp').write_bytes((p/'hero-night.webp').read_bytes())
          (p/'source.png').unlink()
          PY
      - name: Include current build sources for compatibility review
        run: |
          mkdir -p /tmp/night-assets/current-scripts
          cp scripts/*.py scripts/*.cjs /tmp/night-assets/current-scripts/
          cp .github/workflows/pages.yml /tmp/night-assets/current-scripts/pages.yml
      - uses: actions/upload-artifact@v4
        with:
          name: pethome-night-assets
          path: /tmp/night-assets
          retention-days: 7
