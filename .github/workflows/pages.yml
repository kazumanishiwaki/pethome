name: Validate and publish pethome preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build public files
        run: python3 scripts/build.py
      - name: Check JavaScript syntax
        run: node --check assets/js/site.js
      - name: Save independently downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: pethome-preview
          path: dist
          include-hidden-files: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages (must first be enabled in repository Settings)
        uses: actions/configure-pages@v5
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
