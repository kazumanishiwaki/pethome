name: Validate and publish pethome preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and all 192 combinations of the four-question check
        run: python3 scripts/build.py
      - name: Save downloadable static HTML
        uses: actions/upload-artifact@v4
        with:
          name: pethome-preview
          path: dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deterministic delivery checks
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - name: Deploy updated HTML and review exports
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published copy, four-question data and image bytes
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_published.py "$SITE_URL"
