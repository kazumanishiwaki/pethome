name: Apply tested pethome content sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-content.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply checksum-verified public source files only
        env:
          ARCHIVE_URL: https://at.adobe.com/wrpKQbcm89vC18s2
        run: |
          python3 - <<'PY'
          import os, io, json, hashlib, urllib.request, zipfile
          from pathlib import Path
          expected_hash = '4161caf6a3da269c606705705fca8900cdcec54f0659ffa4fe19394db50e9a0d'
          allowed = {'index.html','terms.html','.gitignore','assets/css/imagery.css','assets/css/ai-review.css','assets/js/review-page.js','data/images.json','scripts/generate_review.py','scripts/export_review_states.cjs','scripts/build.py','scripts/check_published.py','docs/content-review.md'}
          request = urllib.request.Request(os.environ['ARCHIVE_URL'], headers={'User-Agent':'pethome-source-import/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read(200001)
          assert len(data) <= 200000 and hashlib.sha256(data).hexdigest() == expected_hash, 'Source archive checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(data))
          assert len(archive.infolist()) == len(allowed)+1 and set(archive.namelist()) == allowed | {'_change_manifest.json'}, 'Unexpected archive paths'
          assert all(0 < i.file_size < 100000 for i in archive.infolist()), 'Unexpected file size'
          manifest = json.loads(archive.read('_change_manifest.json'))
          assert len(manifest) == len(allowed) and {m['path'] for m in manifest} == allowed
          changes = []
          for item in manifest:
              path = Path(item['path'])
              content = archive.read(item['path'])
              content.decode('utf-8')
              assert hashlib.sha256(content).hexdigest() == item['sha256'], 'Source checksum mismatch'
              if path.exists():
                  previous = path.read_bytes()
                  before_hash = hashlib.sha1(b'blob '+str(len(previous)).encode()+b'\0'+previous).hexdigest()
                  assert previous == content or before_hash == item['before_git_blob'], 'Source changed concurrently: '+str(path)
              else:
                  assert item['before_git_blob'] is None, 'Expected existing file missing: '+str(path)
              changes.append((path,content))
          for path,content in changes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              print('Applied', path, len(content))
          PY
      - name: Validate generated pages, image integrity and JavaScript
        run: python3 scripts/build.py
      - name: Commit only approved source files
        run: |
          git add -- index.html terms.html .gitignore assets/css/imagery.css assets/css/ai-review.css assets/js/review-page.js data/images.json scripts/generate_review.py scripts/export_review_states.cjs scripts/build.py scripts/check_published.py docs/content-review.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate AI imagery and automatically aggregate public review content'
            git push origin HEAD:main
          fi
