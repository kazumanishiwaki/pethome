name: Import approved pethome imagery
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-imagery.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import only the six approved WebP assets
        env:
          ARCHIVE_URL: https://at.adobe.com/MvIuLWoFtws8jv5x
        run: |
          python3 - <<'PY'
          import os, io, hashlib, urllib.request, zipfile
          from pathlib import Path
          expected_hash = 'd04f6741f23b4a90a4a02b359228d4384399fc099098b999299b87b07778e89a'
          names = {'assets/img/' + name + size + '.webp' for name in ['cat-wall','cat-entrance','dog-living'] for size in ['', '-small']}
          request = urllib.request.Request(os.environ['ARCHIVE_URL'], headers={'User-Agent':'pethome-asset-import/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read(1000001)
          assert len(data) <= 1000000, 'Unexpected archive size'
          assert hashlib.sha256(data).hexdigest() == expected_hash, 'Archive checksum mismatch'
          archive = zipfile.ZipFile(io.BytesIO(data))
          assert len(archive.infolist()) == 6 and set(archive.namelist()) == names, 'Unexpected archive paths'
          for info in archive.infolist():
              assert 0 < info.file_size < 250000, 'Unexpected image size'
              content = archive.read(info)
              assert content[:4] == b'RIFF' and content[8:12] == b'WEBP', 'Not a WebP'
              path = Path(info.filename)
              if path.exists():
                  assert path.read_bytes() == content, 'Refusing to overwrite changed image'
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
              print(path, len(content), hashlib.sha256(content).hexdigest())
          PY
      - name: Commit only imported images
        run: |
          git add -- assets/img/cat-wall.webp assets/img/cat-wall-small.webp assets/img/cat-entrance.webp assets/img/cat-entrance-small.webp assets/img/dog-living.webp assets/img/dog-living-small.webp
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: add three AI concept images with responsive WebP variants'
            git push origin HEAD:main
          fi
